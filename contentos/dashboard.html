<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>contentos</title>
<style>
:root{--bg:#0b0d12;--panel:#12151c;--line:#232836;--tx:#e6e9f0;--mut:#8b93a7;--ok:#34d399;--run:#fbbf24;--fail:#f87171;--blk:#fb923c;--pend:#3a4156;--acc:#818cf8}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f9;--panel:#fff;--line:#dfe3ec;--tx:#171a23;--mut:#667089;--pend:#c9cfdd}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,"SF Pro Text",system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.pill.on{color:var(--ok);border-color:var(--ok)}.pill.off{color:var(--blk);border-color:var(--blk)}.sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:24px;display:grid;gap:20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:0 0 14px;font-weight:600}
.card-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}.card-h b{font-size:16px}.mut{color:var(--mut)}
.flow{display:flex;align-items:stretch;margin:16px 0 6px;overflow-x:auto;padding-bottom:4px}
.st{min-width:104px;flex:1;text-align:center;position:relative;padding:0 4px}
.st:not(:last-child)::after{content:"";position:absolute;top:17px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:var(--pend)}
.st.ok:not(:last-child)::after,.st.done:not(:last-child)::after{background:var(--ok)}
.dot{width:34px;height:34px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--pend);background:var(--panel);position:relative;z-index:1;color:var(--mut)}
.ok .dot,.done .dot{border-color:var(--ok);color:var(--ok)}.running .dot{border-color:var(--run);color:var(--run);animation:p 1.1s infinite}
.fail .dot{border-color:var(--fail);color:var(--fail)}.blocked .dot,.stale .dot{border-color:var(--blk);color:var(--blk)}
@keyframes p{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--run) 22%,transparent)}}
.st .n{font-weight:600;font-size:13px}.st .m{font-size:11px;color:var(--mut);min-height:30px;word-break:break-word}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:14px}@media(max-width:860px){.cols{grid-template-columns:1fr}}
video{width:100%;max-height:440px;border-radius:10px;background:#000;object-fit:contain}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}.PASS,.OK,.PUBLISH,.pursue{color:var(--ok)}.FAIL,.REVISE,.ABANDON,.drop{color:var(--fail)}.WARN,.HOLD,.watch{color:var(--run)}
.err{color:var(--fail);font-size:12px;margin-top:6px;white-space:pre-wrap}.gates{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.g{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.g.y{color:var(--ok);border-color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.prov{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.prov b{font-size:13px}.prov div{font-size:12px;color:var(--mut)}.up{color:var(--ok)}.dn{color:var(--mut);opacity:.7}
code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:12px}
</style></head><body>
<header><h1>contentos</h1><span id="pub" class="pill"></span><span id="jev" class="pill"></span><span class="sp"></span><span class="pill" id="tick">connecting</span></header>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={OK:'✓',DONE:'✓',RUNNING:'…',FAIL:'✕',BLOCKED:'!',STALE:'?',PENDING:''};
const GATES=['RESEARCH_APPROVED','SCRIPT_APPROVED','PRODUCTION_APPROVED','PUBLISH_APPROVED'];
let playing={};
function card(c){
  const flow=c.stages.map((s,i)=>`<div class="st ${s.status.toLowerCase()}"><div class="dot">${ICON[s.status]??i+1}</div><div class="n">${s.stage}</div>
   <div class="m">${esc(s.provider)}${s.secs!=null?'<br>'+s.secs+'s':''}</div></div>`).join('');
  const errs=c.stages.filter(s=>s.error&&['FAIL','BLOCKED'].includes(s.status)).map(s=>`<div class="err"><b>${s.stage}</b>: ${esc(s.error)}</div>`).join('');
  const qa=c.qa.length?`<table><tr><th>QA check</th><th></th><th>detail</th></tr>${c.qa.map(q=>`<tr><td>${q.check}</td><td><span class="tag ${q.status}">${q.status}</span></td><td class="mut">${esc(q.detail)}</td></tr>`).join('')}</table>`:'<div class="mut">QA has not run yet.</div>';
  const rec=c.recommendation?`<div style="margin-top:12px"><span class="tag ${c.recommendation.decision}" style="font-size:13px">${c.recommendation.decision}</span> <span class="mut">${c.recommendation.reasons.map(esc).join(' · ')}</span><div class="mut" style="font-size:12px;margin-top:4px">Recommendation only. Publishing needs PUBLISH_APPROVED.</div></div>`:`<div class="mut" style="margin-top:12px">No recommendation yet: <code>./contentos.sh recommend ${esc(c.id)}</code></div>`;
  const gates=GATES.map(g=>`<span class="g ${c.approvals[g]?'y':''}">${c.approvals[g]?'✓ ':''}${g}</span>`).join('');
  const vid=c.has_video?`<video controls preload="metadata" src="/media/${c.id}/video.mp4" data-id="${c.id}"></video>`:'<div class="mut" style="padding:60px 0;text-align:center;border:1px dashed var(--line);border-radius:10px">no video yet</div>';
  return `<section><div class="card-h"><b>${esc(c.title)}</b><span class="mut">${esc(c.id)}</span></div><div class="flow">${flow}</div>${errs}<div class="gates">${gates}</div>
  <div class="cols"><div>${vid}</div><div>${qa}${rec}</div></div></section>`;
}
function render(d){
  $('#pub').textContent=d.publish_enabled?'publish: ENABLED':'publish: disabled (dry-run)';$('#pub').className='pill '+(d.publish_enabled?'off':'on');
  const j=d.jev;$('#jev').textContent='Jev: '+(!j.reachable?'unreachable':!j.authed?'needs login cookie':j.jev_configured?'ready':'authed, not configured');$('#jev').className='pill '+(j.authed&&j.jev_configured?'on':'');
  const keep={};document.querySelectorAll('video').forEach(v=>keep[v.dataset.id]={t:v.currentTime,p:!v.paused});
  const provs=Object.entries(d.providers).map(([k,v])=>`<div class="prov"><b>${k}</b> <span class="mut">→ ${v.selected??'NONE'}</span><div>${v.candidates.map(c=>`<span class="${c.healthy?'up':'dn'}">${c.healthy?'●':'○'} ${c.id}</span>`).join('<br>')}</div></div>`).join('');
  const decs=d.decisions.length?`<table><tr><th>type</th><th>subject</th><th>decision</th><th>source</th><th>why</th></tr>${d.decisions.map(x=>`<tr><td>${x.type}</td><td>${esc(x.subject)}</td><td><span class="tag ${x.decision}">${x.decision}</span></td><td class="mut">${x.source}</td><td class="mut">${x.reasons.map(esc).join('; ')}</td></tr>`).join('')}</table>`:'<div class="mut">No decisions yet.</div>';
  const jq=d.jobs.length?`<table><tr><th>job</th><th>video</th><th>status</th><th>secs</th><th>note</th></tr>${d.jobs.map(j=>`<tr><td>${j.id}</td><td>${esc(j.content_id)}</td><td><span class="tag ${j.status==='done'?'OK':j.status==='failed'?'FAIL':j.status==='blocked'?'WARN':''}">${j.status}</span></td><td class="mut">${j.secs}</td><td class="mut">${esc(j.error)}</td></tr>`).join('')}</table>`:'<div class="mut">Queue empty. <code>./contentos.sh queue add specs/*.yaml --approve-private</code> then <code>./contentos.sh worker</code></div>';
  $('#m').innerHTML=`<section><h2>Queue (${d.jobs.filter(j=>j.status==='queued').length} waiting, ${d.jobs.filter(j=>j.status==='running').length} running)</h2>${jq}</section>`+(d.contents.map(card).join('')||'<section class="mut">No projects yet. Run <code>./contentos.sh pipeline run examples/youtube-short.yaml --approve-private</code></section>')+
   `<section><h2>Decisions (Jev + local rules)</h2>${decs}</section><section><h2>Providers (local-first, healthy ●)</h2><div class="grid">${provs}</div></section>`;
  document.querySelectorAll('video').forEach(v=>{const k=keep[v.dataset.id];if(k){v.currentTime=k.t;if(k.p)v.play().catch(()=>{})}});
}
async function tick(){try{const r=await fetch('/api/state');const d=await r.json();
  const busy=d.contents.some(c=>c.stages.some(s=>s.status==='RUNNING'));
  const sig=JSON.stringify(d,(k,v)=>k==='now'?undefined:v);
  if(sig!==tick.sig){tick.sig=sig;render(d)}
  $('#tick').textContent=(busy?'running · ':'idle · ')+new Date().toLocaleTimeString();}
 catch(e){$('#tick').textContent='server offline'}}
tick();setInterval(tick,1500);
</script></body></html>
