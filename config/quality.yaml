video:
  formats:
    "9:16": {width: 1080, height: 1920, max_seconds: 180}
    "16:9": {width: 1920, height: 1080, max_seconds: 3600}
  min_fps: 24
  loudness_lufs: {target: -14, tolerance: 3}
  max_true_peak_db: -0.5
  max_black_seconds: 0.5
  max_freeze_seconds: 3.0
script:
  min_hook_score: 55          # skills/yt-script/hookscore.py verdict floor; advisory, not a predictor
  require_sources_for_claims: true
