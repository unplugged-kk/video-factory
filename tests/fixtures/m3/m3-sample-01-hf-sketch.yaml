script:
  - say: "Every autonomous agent needs durable memory."
    headline: "Agents Need Memory"
    tag: HOOK
  - say: "When a session resets, conversational context vanishes. Without a disk-backed ledger, decisions are lost."
    headline: "Context Vanishes"
    tag: STEP 1
  - say: "Modern architectures use append-only event logs, storing tool calls, inputs, and environment observations."
    headline: "Append-Only Event Logs"
    tag: STEP 2
  - say: "On wakeup, the agent drains new events from disk, reconciling reality before dispatching tasks."
    headline: "Reconcile Reality"
    tag: STEP 3
  - say: "This eliminates guesswork and ensures uninterrupted multi-day execution."
    headline: "Durable Autonomy"
    tag: RECAP
