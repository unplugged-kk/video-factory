name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install pytest pyyaml numpy
          brew install ffmpeg
          npm ci
      # Pinned upstream skills are deliberately not synced: tests that need them skip and print why.
      # Tests write to a scratch workspace, never to a real one.
      - name: pytest
        env:
          VIDEO_FACTORY_WORKSPACE: ${{ runner.temp }}/vf-workspace
          VIDEO_FACTORY_PUBLISH_DIR: ${{ runner.temp }}/vf-publish
        run: |
          mkdir -p "$VIDEO_FACTORY_WORKSPACE" "$VIDEO_FACTORY_PUBLISH_DIR"
          python -m pytest tests -q -rs
      - name: node --test
        run: node --test contentos/adapters/v1/*.test.mjs
      - name: Working tree is clean
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
